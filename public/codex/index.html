<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Codex · Codex Web</title><link rel="stylesheet" href="/codex/shared.css"><link rel="stylesheet" href="/codex/codex.css"><link rel="stylesheet" href="/codex/settings.css"><link rel="stylesheet" href="/codex/message-ui.css"><link rel="stylesheet" href="/codex/column.css"><link rel="stylesheet" href="/codex/artifact-ui.css"><link rel="stylesheet" href="/codex/work-live.css"><link rel="stylesheet" href="/codex/spacing.css"><link rel="stylesheet" href="/codex/thread-activity.css"><link rel="stylesheet" href="/codex/animated-select.css"><link rel="stylesheet" href="/codex/slash-commands.css"><link rel="stylesheet" href="/codex/composer-add.css"><link rel="stylesheet" href="/codex/composer-queue.css"><link rel="stylesheet" href="/codex/workspace-chrome.css"><link rel="stylesheet" href="/codex/composer-resize.css"><link rel="stylesheet" href="/codex/project-picker.css"><link rel="stylesheet" href="/codex/sidebar-actions.css"><link rel="stylesheet" href="/codex/mobile-sidebar.css"><link rel="icon" type="image/png" sizes="32x32" href="/codex/icons/codex-v1-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/codex/icons/codex-v1-180.png"><link rel="manifest" href="/codex/icons/codex-v1.webmanifest"><link rel="stylesheet" href="/codex/icons/site-branding-v1.css"></head>
<body class="codex-app">
<button class="sidebar-scrim" id="sidebar-scrim" aria-label="关闭会话列表" hidden></button>
<aside class="app-sidebar" id="sidebar" aria-label="项目与会话">
<div class="sidebar-head"><a class="brand" href="/codex/"><img class="site-logo" src="/codex/icons/codex-v1-180.png" width="28" height="28" alt="">Codex</a><button class="icon-button" id="close-sidebar" aria-label="收起侧栏">☰</button></div>
<div class="new-chat-actions"><button class="new-chat" id="new">＋ 新建会话 <kbd>Ctrl K</kbd></button><button type="button" class="icon-button" id="new-project" aria-label="选择项目新建会话" title="选择项目新建会话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button></div>
<label class="search-box"><input id="search" type="search" placeholder="搜索会话或项目" aria-label="搜索会话或项目"></label>
<div id="sidebar-history" class="sidebar-history">
<section id="recent-threads" class="recent-threads" aria-labelledby="recent-threads-title" hidden><h2 id="recent-threads-title">最近会话</h2><nav class="recent-thread-list" aria-label="最近五个会话"></nav></section>
<div class="sidebar-caption"><span>项目与会话</span><div class="sidebar-caption-actions"><button type="button" class="icon-button" id="collapse-projects" aria-label="收起所有项目" title="收起所有项目"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5-5 5 5M7 20l5-5 5 5"/></svg></button><button class="icon-button" id="refresh" aria-label="刷新会话">↻</button></div></div><div id="threads" class="thread-list"></div>
</div>
<div class="sidebar-footer"><a class="sidebar-link sidebar-home" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-7h4v7h5V9"/></svg><span>返回主页</span></a><button class="account-button" id="account"><span class="avatar">C</span><span><strong>账号与设置</strong><small id="account-label">读取账号…</small></span><span>⋯</span></button></div>
</aside>
<main class="app-main">
<header class="chat-header"><button class="icon-button" id="toggle-sidebar" aria-label="打开项目与会话" aria-expanded="false">☰</button><div class="chat-heading"><h1 id="title">Codex</h1><div class="thread-meta"><button type="button" id="project-directory" class="project-directory-button" aria-label="选择项目目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span>选择项目</span></button><span id="source"></span><span id="state"></span></div></div><a class="back-management" href="/" aria-label="返回主页" title="返回主页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-7h4v7h5V9"/></svg></a><details class="thread-menu"><summary class="icon-button" aria-label="会话操作">⋯</summary><div class="menu-panel"><button id="rename">重命名会话</button><button id="fork">从这里分支</button><button id="archive">归档会话</button></div></details></header>
<section class="chat-body" aria-label="对话">
<div class="messages" id="messages"><div class="welcome"><div class="welcome-mark">◈</div><h2>今天想一起完成什么？</h2><p>在你的项目中继续工作，或创建一个新的会话。</p><div class="suggestions"><button data-prompt="帮我了解这个项目的结构，先阅读并给出摘要。">了解项目</button><button data-prompt="检查这个项目，帮我找出需要修复的问题。">检查问题</button><button data-prompt="帮我规划接下来要实现的功能，先讨论方案。">规划功能</button></div></div></div>
<div class="requests" id="requests" aria-live="polite"></div>
<div class="composer-wrap"><div class="composer"><textarea id="input" placeholder="给 Codex 分配任务，或继续讨论…" aria-label="消息" rows="1"></textarea><div class="composer-controls"><div class="model-controls"><button type="button" id="composer-add" class="composer-add-button" aria-label="添加内容" title="添加文件、功能与技能"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button><select id="composer-model" aria-label="选择模型"><option value="">读取模型…</option></select><select id="reasoning" aria-label="推理强度"><option value="">读取推理等级…</option></select><select id="access" aria-label="访问权限"><option value="read-only">只读访问</option><option value="workspace-write">工作区读写</option><option value="full-access">完全访问</option></select><select id="approval" aria-label="审批策略"><option value="manual">手动审批</option><option value="automatic">自动审查</option><option value="never">无需审批</option></select></div><div class="send-controls"><button class="icon-button" id="steer" title="追加指令" aria-label="追加指令"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19v-6a5 5 0 0 1 5-5h10m-5-5 5 5-5 5"/></svg></button><button class="icon-button danger-text" id="interrupt" title="中断当前任务" aria-label="中断当前任务"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button><button class="send-button" id="send" aria-label="发送消息"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></div></div></div>
</section><div class="column-handles" aria-label="聊天列宽"><div class="column-handle" data-side="left" tabindex="0" role="separator" aria-orientation="vertical" aria-label="拖动左侧调整聊天列宽" title="拖动调整宽度，双击恢复默认"></div><div class="column-handle" data-side="right" tabindex="0" role="separator" aria-orientation="vertical" aria-label="拖动右侧调整聊天列宽" title="拖动调整宽度，双击恢复默认"></div></div></main>
<div class="modal" id="account-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title"><section class="card settings-card"><div class="settings-header"><h2 id="settings-title">账号与设置</h2><button class="icon-button" id="close-account" aria-label="关闭设置">×</button></div><nav class="settings-tabs" aria-label="设置分类"><button data-settings="account" class="active">账户与额度</button><button data-settings="provider">模型提供方</button><button data-settings="defaults">默认设置</button><button data-settings="notifications">通知</button><button data-settings="runtime">运行信息</button></nav><div class="settings-scroll"><section data-panel="account"><p id="account-info"></p><div class="row"><button id="device-login">登录 ChatGPT 账号</button><button class="secondary" id="account-logout">退出网页账号</button></div><p id="login-code"></p><div class="quota-heading"><h3>套餐与用量</h3><div class="quota-actions"><button class="secondary" id="refresh-limits">刷新额度</button><button id="refresh-subscription" class="secondary" type="button">更新套餐日期</button></div></div><div id="account-subscription" aria-live="polite"></div><div id="rate-limits" aria-live="polite">正在读取…</div><h3>账户使用情况</h3><div id="account-usage"></div></section><section data-panel="provider" hidden><h3>模型与连接配置</h3><div class="settings-fields"><label>配置<select id="profile"></select></label><label>名称<input id="profile-name"></label><label>模型来源<select id="provider"><option value="chatgpt">ChatGPT 套餐</option><option value="api">OpenAI API</option><option value="custom">自定义 Responses 服务</option></select></label><label>默认模型<input id="model" placeholder="留空使用原生默认模型"></label><label>API 地址<input id="base-url" placeholder="https://…/v1"></label><label>API Key<input id="api-key" type="password" autocomplete="off" placeholder="留空保持原值"></label><label class="wide-field">工作目录<input id="cwd"></label></div><button id="save-profile">保存配置</button><p class="muted">网页账号配置与桌面独立；同一账号的会话统一显示。Codex 内核路径由部署配置指定。</p></section><section data-panel="defaults" hidden><h3>字号档位</h3><div class="appearance-fields" data-appearance="fonts"></div><h3 class="appearance-heading">间距档位</h3><div class="appearance-fields" data-appearance="spacing"></div><p class="muted appearance-explanation">所有间距均为上下间距，按上一项底部到下一项顶部计算；行距为字号之外增加的像素。同一档位在聊天中统一复用，修改后立即生效并保存。</p><h3 class="appearance-heading">宽度</h3><div class="appearance-fields" data-appearance="widths"></div><button class="secondary appearance-reset" id="reset-width">恢复默认聊天列宽</button><h3>工作记录与滚动</h3><div class="appearance-fields" data-appearance="work"></div><h3 class="appearance-heading">触屏操作</h3><div class="appearance-fields" data-appearance="gestures"></div><h3 class="appearance-heading">新会话的默认策略</h3><p class="muted">已有会话保留自己的设置。</p><div class="settings-fields"><label>默认访问权限<select id="default-access"><option value="read-only">只读访问</option><option value="workspace-write">工作区读写</option><option value="full-access">完全访问</option></select></label><label>默认审批策略<select id="default-approval"><option value="manual">手动审批</option><option value="automatic">自动审查</option><option value="never">无需审批</option></select></label></div><button id="save-defaults">保存默认设置</button></section><section data-panel="notifications" hidden></section><section data-panel="runtime" hidden><h3>运行配置</h3><div id="runtime-info"></div><h3>可用技能</h3><pre id="skills"></pre></section></div></section></div><div id="notice" role="status"></div>
<script type="module" src="/codex/app.js"></script></body></html>
