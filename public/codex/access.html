<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站访问设置 · Codex Web</title><link rel="stylesheet" href="/codex/shared.css"></head>
<body><main style="max-width:640px;margin:48px auto;padding:24px"><h1>网站访问设置</h1><p>网站密码与 Codex 账号分别管理。首次密码仅可在服务器本机设置。</p><p><a href="/codex/">返回聊天</a></p><form id="setup"><label>首次网站密码 <input id="password" type="password" autocomplete="new-password" required></label><button>保存密码</button></form><p><button id="prepare" type="button">准备注册通行密钥</button> <button id="register" type="button" disabled>添加通行密钥</button></p><p id="status" role="status"></p></main>
<script src="/codex/vendor/webauthn.js"></script><script type="module">
import {session,api} from '/codex/common.js';
import {createPasskeyRegistration} from '/codex/passkey-registration.js';
const status=document.getElementById('status'),info=await session();
document.getElementById('setup').hidden=!info.local||info.configured;
document.getElementById('setup').onsubmit=async event=>{event.preventDefault();const field=document.getElementById('password');try{await api('/codex-api/v1/auth/setup',{password:field.value});field.value='';await session();document.getElementById('setup').hidden=true;status.textContent='网站密码已设置。';}catch(error){status.textContent=error.message;}};
const registration=createPasskeyRegistration({requestOptions:()=>api('/codex-api/v1/auth/passkey/register/options',{}),startRegistration:options=>SimpleWebAuthnBrowser.startRegistration(options)});
document.getElementById('prepare').onclick=async()=>{try{await registration.prepare();document.getElementById('register').disabled=false;status.textContent='已准备，请点击添加通行密钥。';}catch(error){status.textContent=error.message;}};
document.getElementById('register').onclick=async()=>{try{const promise=registration.register();document.getElementById('register').disabled=true;const response=await promise;await api('/codex-api/v1/auth/passkey/register/verify',{response,name:'Web authenticator'});status.textContent='通行密钥已添加。';}catch(error){status.textContent=error.message;}};
</script></body></html>
